<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineWorld | Indian Movies</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,sans-serif;
  background:#08090d;
  color:#fff;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:#11131a;
  border-bottom:1px solid #272a33;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  color:#ffd21c;
  font-size:24px;
  font-weight:800;
}
nav{display:flex;gap:20px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
nav a:hover{color:#ffd21c}

.hero{
  min-height:440px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:60px 20px;
  background:
    radial-gradient(circle,#3c3000,transparent 45%),
    linear-gradient(135deg,#191c27,#08090d);
}
.hero-box{max-width:800px}
.badge{
  display:inline-block;
  padding:8px 15px;
  border:1px solid #555;
  border-radius:30px;
  color:#ffd21c;
  margin-bottom:20px;
}
h1{font-size:56px;margin-bottom:18px}
h1 span{color:#ffd21c}
.hero p{color:#aaa;font-size:18px;margin-bottom:28px}

.search{
  display:flex;
  max-width:620px;
  margin:auto;
  background:white;
  border-radius:10px;
  overflow:hidden;
}
.search input{
  flex:1;
  border:0;
  outline:0;
  padding:16px;
  font-size:16px;
  color:#111;
}
.search button{
  border:0;
  background:#ffd21c;
  padding:0 22px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}
section{padding:45px 0}
.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}
.title h2{font-size:27px}
.title span{color:#888;font-size:13px}

.languages{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}
.lang{
  border:1px solid #30333d;
  background:#15171e;
  color:#ddd;
  padding:9px 15px;
  border-radius:25px;
  cursor:pointer;
}
.lang.active,.lang:hover{
  background:#ffd21c;
  color:#111;
  border-color:#ffd21c;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
}
select{
  background:#15171e;
  color:#fff;
  border:1px solid #30333d;
  padding:11px 13px;
  border-radius:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
  gap:18px;
}
.card{
  background:#14161d;
  border:1px solid #282b35;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}
.card:hover{
  transform:translateY(-5px);
  border-color:#ffd21c;
}
.poster{
  height:250px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:18px;
  background:linear-gradient(145deg,#453900,#15161d);
}
.card:nth-child(3n) .poster{
  background:linear-gradient(145deg,#30284b,#15161d);
}
.card:nth-child(4n) .poster{
  background:linear-gradient(145deg,#173e42,#15161d);
}
.poster-icon{font-size:38px;margin-bottom:10px}
.poster-name{font-size:19px;font-weight:bold}
.info{padding:13px}
.info h3{font-size:16px;margin-bottom:7px}
.rating{color:#ffd21c;font-weight:bold}
.meta{color:#999;font-size:12px;margin-top:5px}

.empty{
  display:none;
  text-align:center;
  padding:50px 10px;
  color:#999;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,.85);
  padding:20px;
  overflow:auto;
}
.modal-box{
  max-width:600px;
  margin:8% auto;
  background:#181a22;
  border:1px solid #343742;
  border-radius:16px;
  padding:28px;
  position:relative;
}
.close{
  position:absolute;
  right:16px;
  top:10px;
  font-size:30px;
  color:#aaa;
  cursor:pointer;
}
.modal-poster{
  width:140px;
  height:190px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:15px;
  background:linear-gradient(145deg,#4b3d00,#171820);
  border-radius:10px;
  color:#ffd21c;
  font-size:20px;
  font-weight:bold;
  margin-bottom:18px;
}
.modal h2{font-size:28px}
.details{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}
.detail{
  background:#292c36;
  padding:7px 11px;
  border-radius:20px;
  font-size:12px;
}
.modal p{
  color:#bbb;
  line-height:1.6;
  margin-top:18px;
}

footer{
  text-align:center;
  padding:35px 20px;
  border-top:1px solid #252832;
  background:#101218;
  color:#777;
}
footer strong{color:#ffd21c}

@media(max-width:650px){
  header{padding:13px 18px}
  .logo{font-size:20px}
  nav{gap:10px}
  nav a{font-size:12px}
  h1{font-size:40px}
  .hero p{font-size:15px}
  .search{flex-direction:column;background:transparent;gap:8px}
  .search input{border-radius:9px}
  .search button{padding:13px;border-radius:9px}
  .grid{grid-template-columns:repeat(2,1fr);gap:11px}
  .poster{height:210px}
  .poster-name{font-size:16px}
  .info{padding:10px}
  .info h3{font-size:14px}
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 CineWorld</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#languages">Languages</a>
    <a href="#movies">Movies</a>
  </nav>
</header>

<section class="hero" id="home">
  <div class="hero-box">
    <div class="badge">🇮🇳 Indian Cinema Discovery</div>
    <h1>Discover <span>Indian Movies</span></h1>
    <p>Search and explore movies from different Indian languages.</p>

    <div class="search">
      <input id="search" placeholder="Search movie name...">
      <button onclick="doSearch()">🔎 Search</button>
    </div>
  </div>
</section>

<section id="languages">
<div class="container">
  <div class="title">
    <h2>🎭 Languages</h2>
    <span>Indian Cinema</span>
  </div>

  <div class="languages" id="languagesList"></div>
</div>
</section>

<section id="movies">
<div class="container">

  <div class="title">
    <h2>🔥 Popular Movies</h2>
    <span id="count"></span>
  </div>

  <div class="filters">
    <select id="genre" onchange="render()">
      <option value="All">All Genres</option>
      <option>Action</option>
      <option>Drama</option>
      <option>Romance</option>
      <option>Comedy</option>
      <option>Thriller</option>
    </select>

    <select id="year" onchange="render()">
      <option value="All">All Years</option>
      <option>2024</option>
      <option>2023</option>
      <option>2022</option>
      <option>2021</option>
      <option>2020</option>
      <option>2019</option>
      <option>2018</option>
      <option>2017</option>
      <option>2016</option>
      <option>2015</option>
    </select>

    <select id="rating" onchange="render()">
      <option value="0">All Ratings</option>
      <option value="8">8+ Rating</option>
      <option value="7">7+ Rating</option>
      <option value="6">6+ Rating</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <h2>😕 No movies found</h2>
    <p>Try another search or filter.</p>
  </div>

</div>
</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="close" onclick="closeModal()">×</div>
    <div class="modal-poster" id="mPoster"></div>
    <h2 id="mTitle"></h2>

    <div class="details">
      <span class="detail" id="mLang"></span>
      <span class="detail" id="mYear"></span>
      <span class="detail" id="mRating"></span>
      <span class="detail" id="mGenre"></span>
    </div>

    <p id="mDesc"></p>
  </div>
</div>

<footer>
  <p>© 2026 <strong>CineWorld</strong></p>
  <p>Indian Movie Discovery Website</p>
</footer>

<script>
const movies=[
["RRR","Telugu",2022,7.8,"Action","🔥","An epic action drama about friendship and revolution."],
["Pushpa: The Rise","Telugu",2021,7.6,"Action","🌲","An action drama set around the red sandalwood trade."],
["Sita Ramam","Telugu",2022,8.5,"Romance","💌","A romantic story involving a soldier and a mysterious letter."],
["Jersey","Telugu",2019,8.5,"Drama","🏏","An emotional sports drama about a former cricketer."],
["Baahubali 2","Telugu",2017,8.2,"Action","⚔️","A grand historical action adventure."],
["Arjun Reddy","Telugu",2017,8.1,"Drama","❤️","A dramatic story about love and personal struggles."],
["Hi Nanna","Telugu",2023,8.2,"Romance","👨‍👧","A family romantic drama about love and memories."],
["Dasara","Telugu",2023,7.6,"Action","🔥","An action drama set in a mining village."],

["Dangal","Hindi",2016,8.3,"Drama","🥇","A sports drama about wrestling and determination."],
["3 Idiots","Hindi",2009,8.4,"Comedy","🎓","Three friends experience college life and friendship."],
["Jawan","Hindi",2023,7.5,"Action","🚆","An action thriller involving justice."],
["Drishyam 2","Hindi",2022,8.2,"Thriller","🔦","A family thriller involving a carefully protected secret."],
["Chhichhore","Hindi",2019,8.0,"Comedy","🏫","A comedy drama about friendship and college memories."],
["Kahaani","Hindi",2012,8.1,"Thriller","🔎","A mystery thriller about a woman searching for her husband."],

["Vikram","Tamil",2022,8.0,"Action","🎯","An action thriller involving an undercover team."],
["96","Tamil",2018,8.5,"Romance","📷","A nostalgic romantic drama about school friends."],
["Kaithi","Tamil",2019,8.4,"Action","🚔","An intense action thriller about a prisoner."],
["Master","Tamil",2021,7.3,"Action","🎬","An action drama involving a teacher."],
["Nayakan","Tamil",1987,8.7,"Drama","👑","A classic Indian crime drama."],

["Premam","Malayalam",2015,8.3,"Romance","🌸","A coming-of-age romantic drama."],
["Drishyam","Malayalam",2013,8.6,"Thriller","🔦","A family thriller about protecting loved ones."],
["Kumbalangi Nights","Malayalam",2019,8.5,"Drama","🌊","A family drama about four brothers."],

["Kantara","Kannada",2022,8.2,"Action","🌿","A folklore-inspired action drama."],
["KGF: Chapter 1","Kannada",2018,8.2,"Action","⛏️","An action drama about ambition and gold mining."],
["Dia","Kannada",2020,8.0,"Romance","🌹","An emotional romantic drama."],
["777 Charlie","Kannada",2022,8.6,"Drama","🐶","An emotional journey involving friendship and a dog."],

["Pather Panchali","Bengali",1955,8.5,"Drama","🎞️","A landmark Bengali drama following a family."],
["Sairat","Marathi",2016,8.0,"Romance","❤️","A Marathi romantic drama about young love."],
["Carry On Jatta","Punjabi",2012,8.0,"Comedy","😂","A popular Punjabi comedy about mistaken identities."],
["Chaal Jeevi Laiye","Gujarati",2019,8.0,"Drama","🏔️","A Gujarati family drama about relationships and life."]
];

const languages=["All","Telugu","Hindi","Tamil","Malayalam","Kannada","Bengali","Marathi","Gujarati","Punjabi"];

let selected="All";
let query="";

const langBox=document.getElementById("languagesList");

languages.forEach((lang,i)=>{
  const b=document.createElement("button");
  b.className="lang"+(i===0?" active":"");
  b.textContent=lang;
  b.onclick=()=>{
    selected=lang;
    document.querySelectorAll(".lang").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render();
    document.getElementById("movies").scrollIntoView({behavior:"smooth"});
  };
  langBox.appendChild(b);
});

function render(){

  const genre=document.getElementById("genre").value;
  const year=document.getElementById("year").value;
  const rating=Number(document.getElementById("rating").value);

  const list=movies.filter(m=>
    (selected==="All"||m[1]===selected) &&
    m[0].toLowerCase().includes(query) &&
    (genre==="All"||m[4]===genre) &&
    (year==="All"||String(m[2])===year) &&
    m[3]>=rating
  );

  const grid=document.getElementById("grid");
  grid.innerHTML="";
  document.getElementById("count").textContent=list.length+" Movies";

  document.getElementById("empty").style.display=
    list.length?"none":"block";

  list.forEach(m=>{
    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <div class="poster">
        <div>
          <div class="poster-icon">${m[5]}</div>
          <div class="poster-name">${m[0]}</div>
        </div>
      </div>
      <div class="info">
        <h3>${m[0]}</h3>
        <div class="rating">⭐ ${m[3]}</div>
        <div class="meta">${m[1]} • ${m[2]}</div>
        <div class="meta">${m[4]}</div>
      </div>
    `;

    card.onclick=()=>openMovie(m);
    grid.appendChild(card);
  });
}

function doSearch(){
  query=document.getElementById("search").value.toLowerCase().trim();
  render();
  document.getElementById("movies").scrollIntoView({behavior:"smooth"});
}

document.getElementById("search").addEventListener("input",e=>{
  query=e.target.value.toLowerCase().trim();
  render();
});

function openMovie(m){
  document.getElementById("mPoster").textContent=m[5]+" "+m[0];
  document.getElementById("mTitle").textContent=m[0];
  document.getElementById("mLang").textContent="🎭 "+m[1];
  document.getElementById("mYear").textContent="📅 "+m[2];
  document.getElementById("mRating").textContent="⭐ "+m[3];
  document.getElementById("mGenre").textContent="🎬 "+m[4];
  document.getElementById("mDesc").textContent=m[6];
  document.getElementById("modal").style.display="block";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

window.onclick=e=>{
  if(e.target===document.getElementById("modal")) closeModal();
};

render();
</script>

</body>
</html>
